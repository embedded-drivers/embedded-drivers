[package]
name = "edrv-ssd1327"
documentation = "https://docs.rs/edrv-ssd1327"
description = "SSD1327 grayscale OLED display driver for embedded Rust (no_std, SPI)"
keywords = ["ssd1327", "oled", "display", "spi", "no-std"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
categories.workspace = true

[dependencies]
embedded-hal.workspace = true
embedded-hal-async.workspace = true

[dev-dependencies]
# Only for the framebuffer doc examples, so `cargo test` verifies them.
embedded-graphics.workspace = true

[features]
default = []
std = []

[lints]
workspace = true
