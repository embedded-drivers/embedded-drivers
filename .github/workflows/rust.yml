name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # A missing `.await` or similar is only a warning by default, which is how the
  # sht20 async delay bug survived. Make warnings fatal.
  RUSTFLAGS: -Dwarnings

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: cargo build --all --verbose

    - name: Test
      run: cargo test --all --verbose

    # rustfmt.toml uses `group_imports` and `imports_granularity`, which are
    # nightly-only, so the formatting gate must run on nightly or it would
    # disagree with `cargo +nightly fmt` used locally.
    - name: Install nightly rustfmt and clippy
      run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy

    - name: Format
      run: cargo +nightly fmt --all --check

    - name: Clippy
      run: cargo +nightly clippy --all --all-targets -- -D warnings

  # The workspace declares an MSRV and every crate inherits it, but neither of
  # those is a check: `resolver = "3"` only *prefers* dependencies that still
  # build on it, and the manifest only tells downstream users what we claim. This
  # is the job that actually fails when the claim stops being true. It reads the
  # version out of the manifest instead of repeating it here, so the floor and the
  # toolchain under test cannot drift apart.
  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Read the declared MSRV from the workspace manifest
      id: msrv
      run: |
        version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
        if [ -z "$version" ]; then
          echo "no rust-version in [workspace.package]" >&2
          exit 1
        fi
        echo "Declared MSRV: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install the declared MSRV
      run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

    - name: Build with the declared MSRV
      run: cargo +${{ steps.msrv.outputs.version }} build --all --verbose

    - name: Test with the declared MSRV
      run: cargo +${{ steps.msrv.outputs.version }} test --all --verbose
