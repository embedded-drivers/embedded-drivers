[package]
name = "edrv-pmsx003"
documentation = "https://docs.rs/edrv-pmsx003"
description = "Plantower PMSx003 particulate matter (PM1.0/PM2.5/PM10) sensor driver for embedded Rust (no_std, UART)"
# crates.io keywords allow only letters, digits, '-' and '_', so "pm2.5" is
# rejected (HTTP 400 at upload). "pm25" plus "particulate" keeps it findable.
keywords = ["pmsx003", "pms5003", "pm25", "particulate", "no-std"]
readme = "README.md"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true

[dependencies]
embedded-io.workspace = true
embedded-io-async.workspace = true

[features]
default = []
std = []

[lints]
workspace = true
