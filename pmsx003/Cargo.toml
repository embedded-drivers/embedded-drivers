[package]
name = "edrv-pmsx003"
documentation = "https://docs.rs/edrv-pmsx003"
description = "Driver for Plantower PMSx003 particulate sensors (PMS1003/3003/5003/7003/9003), maintained by the embedded-drivers team"
# crates.io keywords allow only letters, digits, '-' and '_', so "pm2.5" is
# rejected (HTTP 400 at upload). "pm25" plus "particulate" keeps it findable.
keywords = ["no-std", "embedded", "embedded-hal-driver", "pm25", "particulate"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
categories.workspace = true

[dependencies]
embedded-io.workspace = true
embedded-io-async.workspace = true

[features]
default = []
std = []

[lints]
workspace = true
