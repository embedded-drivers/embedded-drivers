[workspace]
# Resolver 3 is what makes the MSRV below mean something at resolution time: it
# changes `resolver.incompatible-rust-versions` from `allow` to `fallback`, so a
# dependency that has raised its own MSRV past ours is no longer picked in
# preference to one that still builds. Edition 2024 would default to this, but
# the explicit line is kept so the intent survives anyone pinning an edition.
resolver = "3"
members = [
    "hmc5883l",
    "adxl345",
    "l3g4200d",
    "bmp180",
    "bme280",
    "bme680",
    "ssd1327",
    "st7735",
    "sht20",
    "ltr390uv",
    "mpu6050",
    "mhz19",
    "pmsx003",
    "vl53l0x",
    "spl06",
]

exclude = ["template"]

[workspace.package]
# Deliberately no `version` here. Versions are per crate so that fixing a bug
# in one driver does not force a release of all of them; each crate declares its
# own `version = "..."`. Do not reintroduce a workspace-wide version.
edition = "2024"
# Edition 2024 needs Rust 1.85. This is a real floor in three places, and all
# three have to agree:
#   * every crate says `rust-version.workspace = true`, so the value reaches
#     crates.io - without that the published metadata carries no MSRV at all;
#   * `resolver = "3"` above makes the resolver prefer dependencies that still
#     build on it;
#   * the `msrv` CI job builds with this exact toolchain, reading the version
#     from this line so the job and the floor cannot drift apart.
rust-version = "1.85"
authors = ["Andelf <andelf@gmail.com>"]
repository = "https://github.com/embedded-drivers/embedded-drivers"
license = "MIT OR Apache-2.0"
categories = ["no-std", "hardware-support", "embedded"]

[workspace.dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-graphics-core = "0.4.1"
embedded-graphics = "0.8.2"
# Byte-stream transports for the UART sensors (MH-Z19, PMSx003).
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"

[workspace.lints.rust]
# These are hardware drivers; there is no reason for unsafe, and a panic in a
# no_std driver is usually a bug worth catching at review time.
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Start from clippy's own correctness/style/complexity/perf groups, then add a
# small curated set that matters for driver code. Deliberately not `pedantic`,
# and deliberately not `cast_lossless`: these drivers cast between integer widths
# and to f32 constantly, and the "fix" (`f32::from(x)`) is less readable than the
# cast. A lint that fires on every line trains people to ignore the output.
all = { level = "warn", priority = -1 }
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
